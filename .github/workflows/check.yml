name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n build.sh
      - run: ./build.sh --check
      - name: Image must remain gated
        run: |
          set +e
          ./build.sh --image
          result=$?
          test "$result" -eq 2
