name: Full experimental CM0 kernel
on:
  push:
    paths:
      - 'kernel/cardputer-v5.config'
      - 'tools/build_vendor_modules.py'
      - 'scripts/check-cm0-dt.sh'
      - '.github/workflows/kernel-full.yml'
permissions:
  contents: read
jobs:
  full-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make flex bison libssl-dev libelf-dev bc device-tree-compiler kmod
      - name: Fetch locked sources
        run: |
          python3 tools/fetch_build_sources.py kernel --destination .cache/full-kernel
          python3 tools/fetch_build_sources.py vendor --destination .cache/full-vendor
      - name: Configure experimental CM0 kernel
        run: |
          mkdir -p out/full
          make -C .cache/full-kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCONFIG_ALLCONFIG="$PWD/kernel/cardputer-v5.config" allnoconfig > out/full/configure.log 2>&1
          cp .cache/full-kernel/.config out/full/kernel.config
          make -s -C .cache/full-kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease > out/full/kernelrelease.txt
      - name: Build Image and ALL configured modules (no modpost bypass)
        run: |
          make -C .cache/full-kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j4 Image modules > out/full/kernel-build.log 2>&1
          test -s .cache/full-kernel/Module.symvers
          cp .cache/full-kernel/Module.symvers out/full/Module.symvers
          cp .cache/full-kernel/arch/arm64/boot/Image out/full/Image
      - name: Link vendor modules against matching symbol table
        run: |
          python3 tools/build_vendor_modules.py --kernel-build .cache/full-kernel --vendor-source .cache/full-vendor --mode modules --jobs 4 --output out/full/vendor
          release=$(cat out/full/kernelrelease.txt)
          for module in out/full/vendor/drivers/*.ko; do
            vermagic=$(modinfo -F vermagic "$module")
            [[ "$vermagic" == "$release "* ]]
            [[ "$vermagic" == *'modversions'* ]]
            printf '%s: %s\n' "${module##*/}" "$vermagic" >> out/full/vermagic.txt
          done
      - name: Build CM0 base DTB and merge v5 overlays
        run: |
          make -C .cache/full-kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- DTC_FLAGS=-@ broadcom/bcm2710-rpi-cm0.dtb > out/full/dt-build.log 2>&1
          bash scripts/check-vendor-overlays.sh .cache/full-vendor out/full/overlays
          bash scripts/check-cm0-dt.sh .cache/full-kernel/arch/arm64/boot/dts/broadcom/bcm2710-rpi-cm0.dtb out/full/overlays out/full/merged-dt
      - name: Retain logs even when build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-kernel-build
          path: |
            out/full/*.log
            out/full/kernel.config
            out/full/kernelrelease.txt
            out/full/Module.symvers
            out/full/vermagic.txt
            out/full/vendor/report.json
            out/full/vendor/build.log
            out/full/overlays/**
            out/full/merged-dt/**
          if-no-files-found: warn
